name: nofuture
description: "NO FUTURE? — verified achievements and opportunities for students (Hackathon Burgas 26)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.18.3   # database, auth, storage
  go_router: ^18.1.4          # URLs and navigation (core/router.dart)
  shared_preferences: ^2.5.6  # remembers theme and language in the browser
  lucide_icons_flutter: ^4.0.1 # icons: LucideIcons.xxx (same set as the Lovable design)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true

  # Cyrillic-capable fonts, bundled (no runtime fetch from Google: GDPR).
  # Oswald and Caveat are variable fonts: weight via FontVariation("wght", …).
  # Family names are used in lib/core/theme/app_theme.dart (ZineFonts).
  fonts:
    - family: RubikGlitch
      fonts:
        - asset: assets/fonts/RubikGlitch-Regular.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
